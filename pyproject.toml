[project]
name = "gazemap"
version = "0.1.0"
description = "Local attention heatmaps for web pages using a saliency model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "scipy>=1.13",
    "pillow>=10.0",
    "playwright>=1.45",
    "deepgaze-pytorch",
    "pypdfium2>=5.13.0",
]

[project.scripts]
gazemap = "gazemap.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
deepgaze-pytorch = { git = "https://github.com/matthias-k/DeepGaze", tag = "v1.1.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: end-to-end test that needs model weights and Chromium"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gazemap"]
