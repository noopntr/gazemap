[project]
name = "gazemap"
version = "0.1.0"
description = "Predict where people look first on a web page, screenshot, or PDF: local attention heatmaps from a saliency model, no API keys"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nodo Kobakhidze" }]
keywords = [
    "attention-heatmap",
    "saliency",
    "eye-tracking",
    "visual-attention",
    "deepgaze",
    "ux",
    "design-review",
    "playwright",
    "heatmap",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "scipy>=1.13",
    "pillow>=10.0",
    "playwright>=1.45",
    "deepgaze-pytorch",
    "pypdfium2>=5.13.0",
]

[project.urls]
Repository = "https://github.com/noopntr/gazemap"
Issues = "https://github.com/noopntr/gazemap/issues"

[project.scripts]
gazemap = "gazemap.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
deepgaze-pytorch = { git = "https://github.com/matthias-k/DeepGaze", tag = "v1.1.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: end-to-end test that needs model weights and Chromium"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gazemap"]
