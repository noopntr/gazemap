<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: single button</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #cta {
    position: absolute; left: 25%; top: 35%;
    width: 240px; height: 80px;
    background: #e11d48; color: #ffffff; border: 0; border-radius: 8px;
    font: 700 28px/80px system-ui, sans-serif; text-align: center;
  }
</style>
</head>
<body>
  <button id="cta" type="button">Get started</button>
</body>
</html>
